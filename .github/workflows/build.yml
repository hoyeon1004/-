
name: Build Doomsday Clock APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Extract project ZIP
        run: |
          unzip -o DoomsdayClock_DarkEdition.zip -d project

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DoomsdayClock-DarkEdition-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
